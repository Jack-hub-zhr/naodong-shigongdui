name: keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: |
          curl -fsS --max-time 30 https://naodong-shigongdui.onrender.com/healthz || true
      - name: Ping static site
        run: |
          curl -fsS --max-time 30 https://forgecrew-studio.onrender.com/ || true
