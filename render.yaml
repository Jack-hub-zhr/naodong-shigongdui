services:
  - type: web
    name: forgecrew
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build:web
    startCommand: node server/index.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      # 在 Render 控制台填入真实密钥，不要提交到仓库
      - key: DEEPSEEK_API_KEY
        sync: false
